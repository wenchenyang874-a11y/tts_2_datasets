name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Check public release
        run: bash scripts/check_public_release.sh

      - name: Compile Python
        run: python -m compileall -q app.py audio_utils.py db.py project_settings.py providers.py settings_store.py voice_catalog.py private_settings.py desktop desktop_main.py scripts tests

      - name: Check JavaScript
        run: node --check static/app.js

      - name: Run tests
        run: pytest -q

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build Docker image
        run: docker build -t tts-2-datasets:ci .

      - name: Smoke-test Docker image
        run: |
          container=tts-2-datasets-ci
          cleanup() { docker rm -fv "$container" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          docker run -d --name "$container" tts-2-datasets:ci
          for attempt in $(seq 1 30); do
            health="$(docker inspect --format '{{.State.Health.Status}}' "$container")"
            if [ "$health" = "healthy" ]; then
              break
            fi
            if [ "$health" = "unhealthy" ]; then
              docker logs "$container"
              exit 1
            fi
            sleep 1
          done
          test "$(docker inspect --format '{{.State.Health.Status}}' "$container")" = "healthy"
